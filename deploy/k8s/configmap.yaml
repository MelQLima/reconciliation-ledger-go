apiVersion: v1
kind: ConfigMap
metadata:
  name: ledger-api
data:
  HTTP_ADDR: ":8080"
  LOG_LEVEL: info
  REDIS_ADDR: redis:6379
  KAFKA_BROKERS: kafka-0.kafka:9092,kafka-1.kafka:9092,kafka-2.kafka:9092
  KAFKA_TOPIC: payments.events
  KAFKA_DLQ_TOPIC: payments.events.dlq
  KAFKA_GROUP_ID: ledger
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
