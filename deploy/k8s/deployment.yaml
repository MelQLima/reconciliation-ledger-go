apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-api
  labels: { app: ledger-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: ledger-api }
  template:
    metadata:
      labels: { app: ledger-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: ghcr.io/melqlima/conciliacao-ledger-go:latest
          ports: [{ containerPort: 8080, name: http }]
          envFrom:
            - configMapRef: { name: ledger-api }
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: ledger-api, key: database-url }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-api
spec:
  selector: { app: ledger-api }
  ports: [{ port: 80, targetPort: http, name: http }]
